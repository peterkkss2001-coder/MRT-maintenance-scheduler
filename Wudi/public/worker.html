<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Worker Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <h2>Employee Safety System</h2>

        <button onclick="logout()" class="logout-button">
            Logout
        </button>

    </nav>


    <main class="dashboard">

        <div class="welcome-card">

            <h1 id="workerName">
                Welcome
            </h1>

            <p id="workerDetails"></p>

        </div>


        <div class="emergency-card">

            <div class="emergency-icon">
                🚨
            </div>

            <h2>Emergency Assistance</h2>

            <p>
                If you are experiencing an emergency,
                submit an emergency alert to your supervisor.
            </p>

            <button
                onclick="showEmergencyForm()"
                class="emergency-button"
            >
                EMERGENCY
            </button>

        </div>


        <div id="workerEmergencyStatus" class="form-card hidden">
            <h2>Safety Message</h2>
            <p id="workerEmergencyStatusText"></p>
        </div>

        <div
            id="emergencyForm"
            class="form-card hidden"
        >

            <h2>Report Emergency</h2>

            <label>Emergency Type</label>

            <select id="emergencyType">

                <option value="">
                    Select emergency type
                </option>

                <option value="Injury">
                    Injury
                </option>

                <option value="Fire">
                    Fire
                </option>

                <option value="Equipment Failure">
                    Equipment Failure
                </option>

                <option value="Electrical Hazard">
                    Electrical Hazard
                </option>

                <option value="Medical Emergency">
                    Medical Emergency
                </option>

                <option value="Need More Time">
                    Need More Time
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Describe the emergency</label>

            <textarea
                id="emergencyDescription"
                rows="5"
                placeholder="Explain what happened and where..."
            ></textarea>


            <button
                onclick="submitEmergency()"
                class="primary-button"
            >
                SEND EMERGENCY ALERT
            </button>

            <button
                onclick="hideEmergencyForm()"
                class="secondary-button"
            >
                Cancel
            </button>

            <p id="emergencyMessage"></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
