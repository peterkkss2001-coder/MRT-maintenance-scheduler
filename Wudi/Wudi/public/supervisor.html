<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Supervisor Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <h2>Supervisor Dashboard</h2>

        <button onclick="logout()" class="logout-button">
            Logout
        </button>

    </nav>


    <main class="dashboard">

        <div id="rejectModal" class="modal hidden">

            <div class="modal-content">

                <h3>Reject Emergency</h3>

                <label for="rejectReasonInput">
                    Reason for rejection
                </label>

                <textarea
                    id="rejectReasonInput"
                    rows="4"
                    placeholder="Enter the reason here..."
                ></textarea>

                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelReject"
                        class="secondary-button modal-secondary-button"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        id="confirmReject"
                        class="primary-button modal-primary-button"
                    >
                        Reject
                    </button>

                </div>

            </div>

        </div>

        <div class="welcome-card">

            <h1 id="supervisorName">
                Welcome Supervisor
            </h1>

            <p>
                Monitor employees and emergency alerts.
            </p>

        </div>


        <div class="stats-container">

            <div class="stat-card">

                <h3>Total Employees</h3>

                <strong id="employeeCount">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <h3>Active Emergencies</h3>

                <strong id="activeEmergencyCount">
                    0
                </strong>

            </div>

        </div>


        <section class="section">

            <h2>🚨 Emergency Alerts</h2>

            <div id="emergencyList">

                <p>
                    Loading emergencies...
                </p>

            </div>

        </section>


        <section class="section">

            <h2>Employees</h2>

            <div id="employeeList">

                <p>
                    Loading employees...
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
